---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gasolinerabot
  namespace: flux-system
spec:
  interval: 1m0s
  url: oci://ghcr.io/kevinpita/charts/gasolinerabot
  # Highest published version. Pin a version here to roll back.
  ref:
    semver: "*"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gasolinerabot
  namespace: flux-system
spec:
  interval: 10m0s
  releaseName: gasolinerabot
  targetNamespace: gasolinerabot
  install:
    createNamespace: true
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: gasolinerabot
  values:
    deployment:
      enabled: true
    openbao:
      enabled: true
    postgresql:
      enabled: true
