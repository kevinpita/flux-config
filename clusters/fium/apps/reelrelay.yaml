---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: reelrelay
  namespace: flux-system
spec:
  interval: 1m0s
  url: oci://ghcr.io/kevinpita/charts/reelrelay
  # Highest published version. Pin a version here to roll back.
  ref:
    semver: "*"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reelrelay
  namespace: flux-system
spec:
  interval: 10m0s
  # The Deployment name and its immutable selector come from this name.
  releaseName: reel-relay
  targetNamespace: reelrelay
  install:
    createNamespace: true
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: reelrelay
  values:
    openbao:
      enabled: true
    tmpSizeLimit: 2Gi
