---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nec850
  namespace: flux-system
spec:
  interval: 1m0s
  url: oci://ghcr.io/kevinpita/manifests/nec850
  # Highest published version. Pin a version here to roll back.
  ref:
    semver: "*"
  # The package is private. This Secret is created by hand and is not in Git.
  secretRef:
    name: nec850-ghcr
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nec850
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./
  prune: true
  sourceRef:
    kind: OCIRepository
    name: nec850
